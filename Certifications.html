  <!-- Modal -->
  <div class="modal fade" id="certModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-body p-0 position-relative">
          <button type="button" class="btn-close position-absolute end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
          <img src="" id="certModalImg" class="img-fluid w-100" alt="">
          <p id="certModalCaption" class="mt-2 text-center text-muted small"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function(){
      function decodePath(p){ try { return decodeURIComponent(p); } catch(e){ return p; } }
      document.querySelectorAll('.cert-link').forEach(function(el){
        el.addEventListener('click', function(e){
          e.preventDefault();
          var src = el.getAttribute('data-src');
          var alt = el.getAttribute('data-alt') || '';
          var img = document.getElementById('certModalImg');
          var cap = document.getElementById('certModalCaption');
          img.src = src;
          img.alt = alt;
          cap.textContent = alt;
          var modalEl = document.getElementById('certModal');
          var bs = new bootstrap.Modal(modalEl);
          bs.show();
        });
      });
    })();
  </script>
